services:
  meowhub-news:
    build: .
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      APP_URL: https://${DOMAIN}
      SESSION_SECRET: ${SESSION_SECRET}
      DATA_DIR: /data
      LOGTO_ISSUER: ${LOGTO_ISSUER}
      LOGTO_CLIENT_ID: ${LOGTO_CLIENT_ID}
      LOGTO_CLIENT_SECRET: ${LOGTO_SECRET}
      LOGTO_SCOPES: ${LOGTO_SCOPES:-openid profile email}
      LOGTO_ADMIN_EMAILS: ${LOGTO_ADMIN_EMAILS}
    extra_hosts:
      - "auth.meowhub.de:${LOGTO_INTERNAL_IP:-10.10.10.10}"
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - meowhub_news_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - internal
volumes:
  meowhub_news_data:
    name: meowhub_news_data
networks:
  internal:
